# Loopback-only validation profile. It deliberately loads no external plugins,
# discovers no PCI devices, and keeps every socket and log below /tmp.
unix {
  nodaemon
  runtime-dir /tmp/dang-vpp-run
  cli-listen /tmp/dang-vpp-run/cli.sock
  log /tmp/dang-vpp-run/vpp.log
}

api-segment {
  prefix dangd-test
}

statseg {
  socket-name /tmp/dang-vpp-run/stats.sock
}

socksvr {
  socket-name /tmp/dang-vpp-run/api.sock
}

plugins {
  plugin default { disable }
}
